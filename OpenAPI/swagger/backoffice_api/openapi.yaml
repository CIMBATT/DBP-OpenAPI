openapi: 3.0.0
info:
  title: Digital Battery Passport Back Office API
  description: |
    This OpenAPI specification describes the DBP Back Office API that needs to be implemented and coupled to the Back Office data storage. 
    There are 3 kinds of DBP's and endpoints are defined for each):
    1. Public Information Tier: 
      - Visible to everyone (consumers, general public) via a QR code scan. 
      - Battery ID & Model: Manufacturer name, battery type, and manufacturing facility. 
      - Performance & Durability: Expected life cycle, capacity, and power. 
      - Environmental Impact: Carbon footprint (per kWh of energy delivered), recycled content percentage, and renewable content share. 
      - Regulatory Compliance: CE mark, EU declaration of conformity.
    
    2. Parties with Legitimate Interest Tier (Restricted Access):
      - Accessible to specific, authorized entities, such as independent repairers, remanufacturers, repurposing operators, and recyclers. 
      - On top of the tier 1 data, the following data must be available to this tier:
          - Detailed Composition: Information on cathode, anode, and electrolyte materials. 
          - Dismantling & Safety: Disassembly instructions, exploded diagrams, and safety guidelines. 
          - Live Data: Current State of Health (SoH) and usage/charging history. 
    
    3. Regulatory Data Tier (Strictly Confidential). 
      - Accessible only by public authoritie, such as the European Commission, national market surveillance authorities, and notified bodies):  
      - Audit Documentation: Detailed evidence of regulatory compliance. 
      - Testing Results: Full technical documentation and test reports. 
      - Proprietary Data: Highly sensitive material composition or manufacturing process data not required for safe handling, but necessary for regulatory validation.
  version: '1.0.0'
  contact:
    name: Battery Passport Team
  license:
    name: MIT

servers:
  - url: http://localhost:3002
    description: Development server
  - url: https://api.battery-passport.example.com
    description: Production server

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Check if the API is running
      tags:
        - Health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /bo/register:
    post:
      summary: Register Back Office API
      description: Register this Back Office API at a target BO endpoint
      tags:
        - Back Office Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BORegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: registered successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/:
    get:
      summary: List all passports with pagination
      description: Retrieve a paginated list of Digital Battery Passports (Tier1 public access)
      tags:
        - Digital Battery Passports
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page (default 25)
          schema:
            type: integer
            minimum: 1
            default: 25
      responses:
        '200':
          description: Passports retrieved successfully with pagination info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassportListResponse'
        '400':
          description: Bad Request (invalid page or limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Create or update Digital Battery Passport
      description: Create a new Digital Battery Passport or update an existing one
      tags:
        - Digital Battery Passports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalBatteryPassport'
      responses:
        '201':
          description: Passport created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDigitalBatteryPassportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /bo/dbp/schema:
    get:
      summary: Get Digital Battery Passport JSON Schema
      description: Retrieve a JSON Schema document describing the Digital Battery Passport payload accepted by the Back Office API
      tags:
        - Digital Battery Passports
      responses:
        '200':
          description: JSON Schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatteryPassportJsonSchema'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/{resourceId}:
    get:
      summary: Get passport by ID
      description: Retrieve a Digital Battery Passport by its resource ID
      tags:
        - Digital Battery Passports
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      responses:
        '200':
          description: Passport retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalBatteryPassport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/{resourceId}/performance:
    get:
      summary: Get battery performance data
      description: Retrieve performance data for a specific battery passport
      tags:
        - Battery Performance
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      responses:
        '200':
          description: Performance data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Update battery performance data
      description: Update performance metrics for a battery passport
      tags:
        - Battery Performance
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Performance'
      responses:
        '201':
          description: Performance data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalBatteryPassport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/{resourceId}/maintenance:
    get:
      summary: Get maintenance information
      description: Retrieve maintenance history for a specific battery passport
      tags:
        - Battery Maintenance
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      responses:
        '200':
          description: Maintenance information retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceInformationItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Add maintenance event
      description: Add a new maintenance event to a battery passport
      tags:
        - Battery Maintenance
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceInformationItem'
      responses:
        '201':
          description: Maintenance event added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: registered successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/{resourceId}/dynamic-updates:
    get:
      summary: Get dynamic updates
      description: Retrieve dynamic updates for a specific battery passport
      tags:
        - Dynamic Updates
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      responses:
        '200':
          description: Dynamic updates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicUpdate'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/t2/{resourceId}:
    get:
      summary: Get passport by ID (Tier2)
      description: Retrieve a Digital Battery Passport by ID (Tier2 - Legitimate Access)
      tags:
        - Digital Battery Passports - Tier2
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      responses:
        '200':
          description: Passport retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalBatteryPassport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/t3/{resourceId}:
    get:
      summary: Get passport by ID (Tier3)
      description: Retrieve a Digital Battery Passport by ID (Tier3 - Regulator Access)
      tags:
        - Digital Battery Passports - Tier3
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: The product identifier of the battery passport
      responses:
        '200':
          description: Passport retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalBatteryPassport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/t2/{resourceId}/performance:
    get:
      summary: Get battery performance data (Tier2)
      description: Retrieve performance data for a specific battery (Tier2)
      tags:
        - Battery Performance - Tier2
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Performance data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Update battery performance data (Tier2)
      description: Update performance metrics for a battery (Tier2)
      tags:
        - Battery Performance - Tier2
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Performance'
      responses:
        '201':
          description: Performance data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalBatteryPassport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/t2/{resourceId}/maintenance:
    get:
      summary: Get maintenance information (Tier2)
      description: Retrieve maintenance history (Tier2)
      tags:
        - Battery Maintenance - Tier2
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Maintenance information retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceInformationItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Add maintenance event (Tier2)
      description: Add a new maintenance event (Tier2)
      tags:
        - Battery Maintenance - Tier2
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceInformationItem'
      responses:
        '201':
          description: Maintenance event added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: registered successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/t2/{resourceId}/dynamic-updates:
    get:
      summary: Get dynamic updates (Tier2)
      description: Retrieve dynamic updates (Tier2)
      tags:
        - Dynamic Updates - Tier2
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dynamic updates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicUpdate'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bo/dbp/t3/{resourceId}/dynamic-updates:
    get:
      summary: Get dynamic updates (Tier3)
      description: Retrieve dynamic updates (Tier3)
      tags:
        - Dynamic Updates - Tier3
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dynamic updates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicUpdate'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Passport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key for authentication

  schemas:
    ApiError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Error message

    BORegisterRequest:
      type: object
      required:
        - publicURL
        - apiKey
        - oemName
      properties:
        publicURL:
          type: string
          format: uri
          description: Public URL of the API
        apiKey:
          type: string
          description: API Key for authentication
        oemName:
          type: string
          description: OEM name

    CreateDigitalBatteryPassportResponse:
      type: object
      required:
        - DBPId
      properties:
        DBPId:
          type: string
          description: Digital Battery Passport ID

    PaginationInfo:
      type: object
      required:
        - page
        - limit
        - total
        - pages
      properties:
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of passports
        pages:
          type: integer
          description: Total number of pages

    PassportListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: Array of Digital Battery Passports
          items:
            $ref: '#/components/schemas/DigitalBatteryPassport'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    Identifier:
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string

    ActivityType:
      type: object
      required:
        - code
        - definition
      properties:
        code:
          type: string
        definition:
          type: string

    MaintenanceInformationItem:
      type: object
      required:
        - eventDate
        - activityType
        - modifications
      properties:
        eventDate:
          type: string
          format: date-time
        activityType:
          $ref: '#/components/schemas/ActivityType'
        modifications:
          type: object
          description: Modification details

    Performance:
      type: object
      required:
        - batteryCondition
        - batteryTechnicalProperties
      properties:
        batteryCondition:
          type: object
          description: Battery condition metrics
        batteryTechnicalProperties:
          type: object
          description: Battery technical properties

    BatteryChemistry:
      type: object
      properties:
        shortName:
          type: string
        clearName:
          type: string

    BatteryMaterial:
      type: object
      properties:
        batteryMaterial:
          type: string
        batteryMaterialLocation:
          type: array
          items:
            type: object
        isCriticalRawMaterial:
          type: boolean

    MaterialComposition:
      type: object
      properties:
        batteryChemistry:
          $ref: '#/components/schemas/BatteryChemistry'
        batteryMaterials:
          type: array
          items:
            $ref: '#/components/schemas/BatteryMaterial'
        hazardousSubstances:
          type: array
          items:
            type: object

    Circularity:
      type: object
      properties:
        renewableContent:
          type: number
        recycledContent:
          type: array
          items:
            type: object
        endOfLifeInformation:
          type: object
        sparePartSources:
          type: array
          items:
            type: object

    SupplyChainDueDiligence:
      type: object
      properties:
        supplyChainDueDiligenceReport:
          type: string
        supplyChainIndices:
          type: number
        thirdPartyAssurances:
          type: string

    CarbonFootprint:
      type: object
      properties:
        absoluteCarbonFootprint:
          type: number
        batteryCarbonFootprint:
          type: number
        carbonFootprintStudy:
          type: string
        carbonFootprintPerformanceClass:
          type: string
        carbonFootprintPerLifecycleStage:
          type: object

    GeneralProductInformation:
      type: object
      required:
        - manufacturerInformation
        - puttingIntoService
        - manufacturingDate
        - batteryMass
        - manufacturingPlace
        - productIdentifier
        - warrantyPeriod
        - batteryCategory
      properties:
        manufacturerInformation:
          $ref: '#/components/schemas/Identifier'
        puttingIntoService:
          type: string
          format: date-time
        manufacturingDate:
          type: string
          format: date-time
        operatorInformation:
          $ref: '#/components/schemas/Identifier'
        batteryMass:
          type: number
        manufacturingPlace:
          type: object
        productIdentifier:
          type: string
        warrantyPeriod:
          type: string
        batteryCategory:
          type: string
        batteryPassportIdentifier:
          type: string

    Label:
      type: object
      properties:
        labelingMeaning:
          type: string
        labelingSymbol:
          type: string
        labelingSubject:
          type: string

    Labeling:
      type: object
      properties:
        resultOfTestReport:
          type: string
        declarationOfConformity:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'

    DynamicUpdate:
      type: object
      properties:
        lastUpdate:
          type: string
          format: date-time
        generalProductInformation:
          type: object
          properties:
            operatorInformation:
              $ref: '#/components/schemas/Identifier'
            batteryStatus:
              type: string
        performance:
          $ref: '#/components/schemas/Performance'

    DigitalBatteryPassport:
      type: object
      required:
        - materialComposition
        - circularity
        - supplyChainDueDiligence
        - maintenanceInformation
        - performance
        - carbonFootprint
        - generalProductInformation
        - labeling
      properties:
        materialComposition:
          $ref: '#/components/schemas/MaterialComposition'
        circularity:
          $ref: '#/components/schemas/Circularity'
        supplyChainDueDiligence:
          $ref: '#/components/schemas/SupplyChainDueDiligence'
        maintenanceInformation:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceInformationItem'
        performance:
          $ref: '#/components/schemas/Performance'
        dynamicUpdates:
          type: array
          items:
            $ref: '#/components/schemas/DynamicUpdate'
        carbonFootprint:
          $ref: '#/components/schemas/CarbonFootprint'
        generalProductInformation:
          $ref: '#/components/schemas/GeneralProductInformation'
        labeling:
          $ref: '#/components/schemas/Labeling'

    BatteryPassportJsonSchema:
      type: object
      description: JSON Schema document describing the Digital Battery Passport payload accepted by the Back Office API.
      required:
        - $schema
        - title
        - type
        - required
        - properties
      properties:
        $schema:
          type: string
          example: https://json-schema.org/draft/2020-12/schema
        title:
          type: string
          example: DigitalBatteryPassport
        type:
          type: string
          example: object
        required:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
        additionalProperties:
          oneOf:
            - type: boolean
            - type: object
              additionalProperties: true
      example:
        $schema: https://json-schema.org/draft/2020-12/schema
        title: DigitalBatteryPassport
        type: object
        required:
          - materialComposition
          - circularity
          - supplyChainDueDiligence
          - maintenanceInformation
          - performance
          - carbonFootprint
          - generalProductInformation
          - labeling
        properties:
          materialComposition:
            type: object
            required:
              - batteryChemistry
              - hazardousSubstances
              - batteryMaterials
            properties:
              batteryChemistry:
                type: object
                required:
                  - shortName
                properties:
                  shortName:
                    type: string
                  clearName:
                    type: string
              hazardousSubstances:
                type: array
                items:
                  type: object
                  required:
                    - hazardousSubstanceIdentifier
                    - hazardousSubstanceImpact
                    - hazardousSubstanceLocation
                  properties:
                    hazardousSubstanceIdentifier:
                      type: string
                    hazardousSubstanceImpact:
                      type: array
                      items:
                        type: string
                    hazardousSubstanceLocation:
                      type: object
                      required:
                        - componentName
                      properties:
                        componentName:
                          type: string
              batteryMaterials:
                type: array
                items:
                  type: object
                  required:
                    - batteryMaterial
                    - batteryMaterialLocation
                    - isCriticalRawMaterial
                  properties:
                    batteryMaterial:
                      type: string
                    batteryMaterialLocation:
                      type: array
                      items:
                        type: object
                        required:
                          - componentName
                        properties:
                          componentName:
                            type: string
                    isCriticalRawMaterial:
                      type: boolean
          circularity:
            type: object
            required:
              - renewableContent
              - recycledContent
              - sparePartSources
              - endOfLifeInformation
            properties:
              renewableContent:
                type: number
              recycledContent:
