components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
      description: API key required for all endpoints except /health

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Unauthorized:
      description: Unauthorized - missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    GatewayError:
      description: Backend service unavailable (502)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
          example: NotFound
        message:
          type: string
          example: Resource not found

    Identifier:
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string

    DigitalBatteryPassport:
      type: object
      required:
        - generalProductInformation
        - materialComposition
        - performance
        - circularity
        - supplyChainDueDiligence
        - carbonFootprint
        - labeling
        - maintenanceInformation
      properties:
        generalProductInformation:
          $ref: '#/components/schemas/GeneralProductInformation'
        materialComposition:
          $ref: '#/components/schemas/MaterialComposition'
        performance:
          $ref: '#/components/schemas/Performance'
        circularity:
          $ref: '#/components/schemas/Circularity'
        supplyChainDueDiligence:
          $ref: '#/components/schemas/SupplyChainDueDiligence'
        carbonFootprint:
          $ref: '#/components/schemas/CarbonFootprint'
        labeling:
          $ref: '#/components/schemas/Labeling'
        maintenanceInformation:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceInformationItem'
        dynamicUpdates:
          type: array
          items:
            $ref: '#/components/schemas/DynamicUpdate'

    GeneralProductInformation:
      type: object
      required:
        - productIdentifier
        - manufacturerInformation
        - batteryMass
        - manufacturingDate
        - puttingIntoService
        - batteryCategory
        - manufacturingPlace
        - warrantyPeriod
      properties:
        productIdentifier:
          type: string
        manufacturerInformation:
          $ref: '#/components/schemas/Identifier'
        operatorInformation:
          $ref: '#/components/schemas/Identifier'
        batteryMass:
          type: number
        manufacturingDate:
          type: string
          format: date
        puttingIntoService:
          type: string
          format: date
        batteryCategory:
          type: string
        manufacturingPlace:
          type: object
          properties:
            postalCode1:
              type: string
        warrantyPeriod:
          type: string
        batteryPassportIdentifier:
          type: string

    MaterialComposition:
      type: object
      required:
        - batteryChemistry
        - batteryMaterials
        - hazardousSubstances
      properties:
        batteryChemistry:
          type: object
          properties:
            shortName:
              type: string
            clearName:
              type: string
        batteryMaterials:
          type: array
          items:
            type: object
            properties:
              batteryMaterial:
                type: string
              batteryMaterialLocation:
                type: array
                items:
                  type: object
                  properties:
                    componentName:
                      type: string
              isCriticalRawMaterial:
                type: boolean
        hazardousSubstances:
          type: array
          items:
            type: object
            properties:
              hazardousSubstanceIdentifier:
                type: string
              hazardousSubstanceImpact:
                type: array
                items:
                  type: string
              hazardousSubstanceLocation:
                type: object
                properties:
                  componentName:
                    type: string

    Performance:
      type: object
      required:
        - batteryCondition
        - batteryTechnicalProperties
      properties:
        batteryCondition:
          type: object
          required:
            - capacityFade
            - internalResistanceIncrease
          properties:
            capacityFade:
              type: object
              properties:
                capacityFadeValue:
                  type: number
                lastUpdate:
                  type: string
                  format: date-time
            internalResistanceIncrease:
              type: array
              items:
                type: object
                properties:
                  batteryComponent:
                    type: string
                  internalResistanceIncreaseValue:
                    type: number
                  lastUpdateInternalResistanceIncrease:
                    type: string
                    format: date-time
        batteryTechnicalProperties:
          type: object
          properties:
            roundTripEfficiencyFade:
              type: number
            cRate:
              type: number
            ratedCapacity:
              type: number
            nominalVoltage:
              type: number
            maximumVoltage:
              type: number
            minimumVoltage:
              type: number
            expectedLifetime:
              type: number
            powerFade:
              type: number
            roundtripEfficiency:
              type: number
            ratedMaximumPower:
              type: number
            expectedNumberOfCycles:
              type: number

    Circularity:
      type: object
      required:
        - renewableContent
        - recycledContent
        - endOfLifeInformation
        - sparePartSources
      properties:
        renewableContent:
          type: number
        recycledContent:
          type: array
          items:
            type: object
            properties:
              recycledMaterial:
                type: string
              postConsumerShare:
                type: number
              preConsumerShare:
                type: number
        endOfLifeInformation:
          type: object
          properties:
            informationOnCollection:
              type: string
            wastePrevention:
              type: string
            separateCollection:
              type: string
        sparePartSources:
          type: array
          items:
            type: object
            properties:
              nameOfSupplier:
                type: string
              components:
                type: array
                items:
                  type: object
                  properties:
                    partName:
                      type: string

    SupplyChainDueDiligence:
      type: object
      required:
        - supplyChainDueDiligenceReport
        - supplyChainIndices
        - thirdPartyAssurances
      properties:
        supplyChainDueDiligenceReport:
          type: string
        supplyChainIndices:
          type: number
        thirdPartyAssurances:
          type: string

    CarbonFootprint:
      type: object
      required:
        - batteryCarbonFootprint
        - carbonFootprintPerformanceClass
        - carbonFootprintStudy
        - carbonFootprintPerLifecycleStage
      properties:
        batteryCarbonFootprint:
          type: number
        absoluteCarbonFootprint:
          type: number
        carbonFootprintPerformanceClass:
          type: string
        carbonFootprintStudy:
          type: string
        carbonFootprintPerLifecycleStage:
          type: object
          properties:
            carbonFootprintPerLifecycleStage1:
              type: array
              items:
                type: object
                properties:
                  lifecycleStage:
                    type: string
                  carbonFootprint:
                    type: number

    Labeling:
      type: object
      required:
        - resultOfTestReport
        - declarationOfConformity
        - labels
      properties:
        resultOfTestReport:
          type: string
        declarationOfConformity:
          type: string
        labels:
          type: array
          items:
            type: object
            properties:
              labelingSubject:
                type: string
              labelingMeaning:
                type: string
              labelingSymbol:
                type: string

    MaintenanceInformationItem:
      type: object
      required:
        - eventDate
        - activityType
        - modifications
      properties:
        eventDate:
          type: string
          format: date-time
        activityType:
          type: object
          required:
            - code
            - definition
          properties:
            code:
              type: string
            definition:
              type: string
        modifications:
          type: object
          required:
            - maintenanceInformation
            - generalProductInformation
            - circularity
          properties:
            maintenanceInformation:
              type: string
            generalProductInformation:
              type: object
              properties:
                operatorInformation:
                  $ref: '#/components/schemas/Identifier'
                productIdentifier:
                  type: string
            circularity:
              type: object
              properties:
                components:
                  type: array
                  items:
                    type: object
                    properties:
                      partName:
                        type: string
                replacementComponents:
                  type: array
                  items:
                    type: object
                    properties:
                      partName:
                        type: string

    DynamicUpdate:
      type: object
      required:
        - lastUpdate
        - generalProductInformation
      properties:
        lastUpdate:
          type: string
          format: date-time
        generalProductInformation:
          type: object
          required:
            - batteryStatus
            - operatorInformation
          properties:
            batteryStatus:
              type: string
            operatorInformation:
              $ref: '#/components/schemas/Identifier'
        performance:
          oneOf:
            - $ref: '#/components/schemas/Performance'
            - type: "null"

    PaginationInfo:
      type: object
      required:
        - page
        - limit
        - total
        - pages
      properties:
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of passports
        pages:
          type: integer
          description: Total number of pages

    PassportListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: Array of Digital Battery Passports
          items:
