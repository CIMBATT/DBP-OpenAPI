openapi: 3.0.0
info:
  title: Digital Battery Passport Public API
  description: |
    This OpenAPI specification describes the DBP Back Office API that needs to be implemented and coupled to the Back Office data storage. 
    There are 3 kinds of DBP's and endpoints are defined for each):
    1. Public Information Tier: 
      - Visible to everyone (consumers, general public) via a QR code scan. 
      - Battery ID & Model: Manufacturer name, battery type, and manufacturing facility. 
      - Performance & Durability: Expected life cycle, capacity, and power. 
      - Environmental Impact: Carbon footprint (per kWh of energy delivered), recycled content percentage, and renewable content share. 
      - Regulatory Compliance: CE mark, EU declaration of conformity.
    
    2. Parties with Legitimate Interest Tier (Restricted Access):
      - Accessible to specific, authorized entities, such as independent repairers, remanufacturers, repurposing operators, and recyclers. 
      - On top of the tier 1 data, the following data must be available to this tier:
          - Detailed Composition: Information on cathode, anode, and electrolyte materials. 
          - Dismantling & Safety: Disassembly instructions, exploded diagrams, and safety guidelines. 
          - Live Data: Current State of Health (SoH) and usage/charging history. 
    
    3. Regulatory Data Tier (Strictly Confidential). 
      - Accessible only by public authoritie, such as the European Commission, national market surveillance authorities, and notified bodies):  
      - Audit Documentation: Detailed evidence of regulatory compliance. 
      - Testing Results: Full technical documentation and test reports. 
      - Proprietary Data: Highly sensitive material composition or manufacturing process data not required for safe handling, but necessary for regulatory validation.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:3003
    description: Development server
  - url: https://api.batterybattery.example.com
    description: Production server

tags:
  - name: Health
    description: API health and status endpoints
  - name: Battery Passport
    description: Battery passport retrieval and management
  - name: Performance
    description: Battery performance metrics
  - name: Maintenance
    description: Battery maintenance history
  - name: Dynamic Updates
    description: Real-time battery status updates
  - name: Tier 2
    description: Tier 2 compatibility routes
  - name: Tier 3
    description: Tier 3 compatibility routes

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Check if the API is running. No authentication required.
      operationId: getHealth
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /dbp/:
    get:
      tags:
                - Battery Passport
      summary: List all battery passports with pagination
      description: Retrieve a paginated list of all available battery passports. This endpoint proxies to the back-office API.
      operationId: listBatteryPassports
      security:
                - api_key: []
      parameters:
                - name: page
                  in: query
                  required: false
                  description: Page number (default 1)
                  schema:
                    type: integer
                    minimum: 1
                    default: 1
                - name: limit
                  in: query
                  required: false
                  description: Number of items per page (default 25)
                  schema:
                    type: integer
                    minimum: 1
                    default: 25
      responses:
                '200':
                  description: List of passports retrieved successfully with pagination info
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/PassportListResponse'
                '400':
                  $ref: '#/components/responses/BadRequest'
                '401':
                  $ref: '#/components/responses/Unauthorized'
                '502':
                  $ref: '#/components/responses/GatewayError'

    post:
      tags:
                - Battery Passport
      summary: Create or update battery passport
      description: Create a new battery passport or update an existing one. This endpoint proxies to the back-office API.
      operationId: createUpdateBatteryPassportList
      security:
                - api_key: []
      requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/DigitalBatteryPassport'
      responses:
                '201':
                  description: Battery passport created or updated
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          DBPId:
                            type: string
                            example: battery-001
                '400':
                  $ref: '#/components/responses/BadRequest'
                '401':
                  $ref: '#/components/responses/Unauthorized'
                '502':
                  $ref: '#/components/responses/GatewayError'
  /bo/dbp/{resourceId}/performance:
    get:
      tags:
        - Performance
      summary: Get performance metrics
      description: Retrieve battery performance and technical properties
      operationId: getPerformance
      security:
        - api_key: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Performance metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/GatewayError'

    post:
      tags:
        - Performance
      summary: Update performance metrics
      description: Update battery performance data
      operationId: updatePerformance
      security:
        - api_key: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Performance'
      responses:
        '201':
          description: Performance updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalBatteryPassport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/GatewayError'

  /bo/dbp/{resourceId}/maintenance:
    get:
      tags:
        - Maintenance
      summary: Get maintenance history
      description: Retrieve maintenance events for a battery passport
      operationId: getMaintenance
      security:
        - api_key: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Maintenance history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceInformationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/GatewayError'

    post:
      tags:
        - Maintenance
      summary: Add maintenance event
      description: Record a new maintenance event
      operationId: addMaintenance
      security:
        - api_key: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceInformationItem'
      responses:
        '201':
          description: Maintenance event added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: registered successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/GatewayError'

  /bo/dbp/{resourceId}/dynamic-updates:
    get:
      tags:
        - Dynamic Updates
      summary: Get dynamic updates
      description: Retrieve dynamic status updates for a battery passport
      operationId: getDynamicUpdates
      security:
        - api_key: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dynamic updates retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/GatewayError'

  /bo/dbp/t2/{resourceId}:
    get:
      tags:
        - Tier 2
      summary: Get battery passport (Tier 2)
      operationId: getBatteryPassportT2
      security:
