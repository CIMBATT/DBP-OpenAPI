# Default values for the federated API and DO .
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# Global values that are for both the API and the DO

podAnnotations: {}
podLabels: {}

global:
  replicaCount: 1

  nameOverride: ""
  fullnameOverride: ""

  imagePullSecrets: []

api:
  image:
    repository: tnode.azurecr.io/cimbatt/bo-api
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: bo-api.cimbatt.digital-passport.org
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: bo-api.cimbatt.digital-passport.org
        hosts:
          - bo-api.cimbatt.digital-passport.org

  service:
    type: ClusterIP
    # -- Port the API Service publishes. Traffic is forwarded to
    # api.config.federated.server.port inside the container.
    port: 8080

  volumes:
    - name: bo-api-config
      secret:
        secretName: bo-api-config
        optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts:
    - name: bo-api-config
      mountPath: "/app/config.yaml"
      subPath: config.yaml
      readOnly: true

  config:
    port: 8080
    apikey: "demo-bo-api-key"
    testdata:
      oemName: "ACME"
    database:
      mongoHost: "localhost"
      mongoPort: 27017
      mongoDb: "dbp"
    bms:
      bmsBaseUrl: "https://influxapi.digital-passport.org/"
      bmsApiKey: "BMSAPI_rJdxZustJ66kzR0BJr0GVB10D9haU7oCMD7uhKnGxN0Goek6PAflxMoG7"
