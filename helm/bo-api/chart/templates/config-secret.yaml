apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bo-api-config
type: Opaque
stringData:
  config.yaml: |
    port: {{ .Values.api.config.port | default 8080 }}
    apiKey: {{ .Values.api.config.apikey | default "demo-bo-api-key" }}
    oemName: {{ .Values.api.config.testdata.oemName | default "ACME" }}
    mongoHost: {{ .Values.api.config.database.mongoHost | default "localhost" }}
    mongoPort: {{ .Values.api.config.database.mongoPort | default 27017 }}
    mongoDb: {{ .Values.api.config.database.mongoDb | default "dbp" }}
    bmsBaseUrl: {{ .Values.api.config.bms.bmsBaseUrl | default "https://influxapi.digital-passport.org/" }}
    bmsApiKey: {{ .Values.api.config.bms.bmsApiKey | default "BMSAPI_rJdxZustJ66kzR0BJr0GVB10D9haU7oCMD7uhKnGxN0Goek6PAflxMoG7" }}
