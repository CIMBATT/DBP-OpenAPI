apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bo-api
  labels:
    {{- include "cimbatt-bo-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      {{- include "cimbatt-bo-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bo-api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cimbatt-bo-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: bo-api
          {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}-bo-api
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ required "api.config.port is required" .Values.api.config.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.api.volumeMounts }}
          volumeMounts:
            {{- range . }}
            - name: {{ printf "%s-%s" $.Release.Name .name | lower | trunc 63 }}
              mountPath: {{ .mountPath | quote }}
              {{- if hasKey . "readOnly" }}
              readOnly: {{ .readOnly }}
              {{- end }}
              {{- if hasKey . "subPath" }}
              subPath: {{ .subPath | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          env:
            {{- range .Values.api.env }}
            - name: {{ .name }}
              value: {{ .value }}
            {{- end }}
      {{- with .Values.api.volumes }}
      volumes:
        {{- range . }}
        - name: {{ printf "%s-%s" $.Release.Name .name | lower | trunc 63 }}
          {{- if and (hasKey . "secret") (hasKey .secret "secretName") }}
          secret:
            secretName: {{ printf "%s-%s" $.Release.Name .secret.secretName | lower | trunc 63 }}
            {{- if hasKey .secret "optional" }}
            optional: {{ .secret.optional }}
            {{- end }}
            {{- if hasKey .secret "defaultMode" }}
            defaultMode: {{ .secret.defaultMode }}
            {{- end }}
          {{- else if hasKey . "configMap" }}
          configMap:
            name: {{ .configMap.name | quote }}
            {{- if hasKey .configMap "items" }}
            items:
              {{- toYaml .configMap.items | nindent 12 }}
            {{- end }}
          {{- else if hasKey . "emptyDir" }}
          emptyDir: {{ toYaml .emptyDir | nindent 10 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
