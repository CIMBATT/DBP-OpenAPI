apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-bo-api
  labels:
    {{- include "cimbatt-bo-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ required "api.service.port is required" .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cimbatt-bo-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bo-api
