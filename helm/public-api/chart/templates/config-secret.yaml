apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cimbatt-public-api.configName" . }}
  labels:
    {{- include "cimbatt-public-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    port: {{ required "api.config.port is required" .Values.api.config.port }}
    apiKey: {{ required "api.config.apiKey is required" .Values.api.config.apiKey | quote }}
    boApiUrl: {{ required "api.config.boApiUrl is required" .Values.api.config.boApiUrl | quote }}
    boApiKey: {{ required "api.config.boApiKey is required" .Values.api.config.boApiKey | quote }}
